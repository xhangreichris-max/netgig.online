<body>

  <header class="site-header">
    <h1>Daily Hourly Schedule</h1>
    <span class="header-date"></span>
  </header>

  <div class="controls">
    <label for="start-time" class="sr-only">Start time</label>
    <select id="start-time">
      <option value="05:00">05:00</option>
      <option value="06:00">06:00</option>
      <option value="07:00" selected>07:00</option>
      <option value="08:00">08:00</option>
      <option value="09:00">09:00</option>
      <option value="10:00">10:00</option>
      <option value="11:00">11:00</option>
      <option value="12:00">12:00</option>
    </select>
    <span class="separator">to</span>
    <label for="end-time" class="sr-only">End time</label>
    <select id="end-time">
      <option value="12:00">12:00</option>
      <option value="13:00">13:00</option>
      <option value="14:00">14:00</option>
      <option value="15:00">15:00</option>
      <option value="16:00">16:00</option>
      <option value="17:00">17:00</option>
      <option value="18:00">18:00</option>
      <option value="19:00">19:00</option>
      <option value="20:00">20:00</option>
      <option value="21:00">21:00</option>
      <option value="22:00" selected>22:00</option>
      <option value="23:00">23:00</option>
      <option value="00:00">00:00</option>
    </select>
    <label for="interval" class="sr-only">Interval</label>
    <select id="interval">
      <option value="15">15 min</option>
      <option value="30">30 min</option>
      <option value="60" selected>60 min</option>
    </select>
  </div>

  <div id="schedule" class="schedule"
       data-start="07:00"
       data-end="22:00"
       data-interval="60"
       data-variant="standard">

    <div class="schedule-row">
      <div class="time-label">07:00</div>
      <div class="task-cell">
        <span class="empty-hint">Start typing to add a task</span>
      </div>
    </div>

    <div class="schedule-row">
