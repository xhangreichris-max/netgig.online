<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{CANONICAL_URL}}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{CANONICAL_URL}}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="../../src/style.css">

  <!-- JSON-LD -->
  <script type="application/ld+json">
{{JSONLD}}
  </script>
</head>
<body>

  <header class="site-header">
    <h1>{{H1}}</h1>
    <span class="header-date"></span>
  </header>

  <div class="controls">
    <label for="start-time" class="sr-only">Start time</label>
    <select id="start-time">
      <option value="05:00">05:00</option>
      <option value="06:00">06:00</option>
      <option value="07:00">07:00</option>
      <option value="08:00">08:00</option>
      <option value="09:00">09:00</option>
      <option value="10:00">10:00</option>
      <option value="11:00">11:00</option>
      <option value="12:00">12:00</option>
    </select>
    <span class="separator">to</span>
    <label for="end-time" class="sr-only">End time</label>
    <select id="end-time">
      <option value="12:00">12:00</option>
      <option value="13:00">13:00</option>
      <option value="14:00">14:00</option>
      <option value="15:00">15:00</option>
      <option value="16:00">16:00</option>
      <option value="17:00">17:00</option>
      <option value="18:00">18:00</option>
      <option value="19:00">19:00</option>
      <option value="20:00">20:00</option>
      <option value="21:00">21:00</option>
      <option value="22:00">22:00</option>
      <option value="23:00">23:00</option>
      <option value="00:00">00:00</option>
    </select>
    <label for="interval" class="sr-only">Interval</label>
    <select id="interval">
      <option value="15">15 min</option>
      <option value="30">30 min</option>
      <option value="60">60 min</option>
    </select>
  </div>

  <div id="schedule" class="schedule"
       data-start="{{DATA_START}}"
       data-end="{{DATA_END}}"
       data-interval="{{DATA_INTERVAL}}"
       data-variant="standard">

{{STATIC_GRID}}
  </div>

  <section class="related-tools">
    <h2>Related Tools</h2>
    <ul>
{{RELATED_LINKS}}
    </ul>
    <p><a href="../../">← All tools</a></p>
  </section>

  <footer class="site-footer">
    <p>netgig.online</p>
  </footer>

  <script src="../../src/planner.js"></script>
</body>
</html>
